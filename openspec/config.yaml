schema: spec-driven
context: |
  FVD is a standalone-game fork of the C++20 openage RTS engine.
  Run the prototype with run game --modpacks fvd. Core gameplay belongs
  to libopenage/gamestate/, input to libopenage/input/, presentation to
  libopenage/presenter/, and mod data/QML to assets/fvd/.
  Simulation events are time-based and world coordinates are fixed-point.
  Multiplayer supports 2-8 humans INCLUDING the lobby host: exactly one
  human Hunter in player slot 1, and 1-7 human Builders in slots 2-8.
  Roles are randomly assigned when the host starts the game; the host's
  weight for becoming Hunter is 0.5 versus 1 for any other participant.
  The Hunter does not build. Solo developer mode switches between Hunter
  and Builder (slots 1 and 2) without an AI player.
  One permanent indestructible Hunter-owned tower occupies map center. From
  match time 20 seconds it attacks enemy Builders within 10 tiles for 100
  damage per missile impact; it does not attack during the Builder head start.
  Hunter horses spawn at valid positions around this tower, not within it.
  The first Hunter horse spawns near the map center at match time 20 seconds;
  another spawns every second thereafter. Idle horses spread apart through
  passive 2D contact separation when the spawn point is crowded, but only
  human Hunter Move or AttackMove orders initiate navigation and attacks.
  AttackMove engages eligible enemies encountered en route, then resumes
  travel to the ordered destination. The Hunter may set a rally point on the
  Hunter tower; new horses then ride there (or as close as they can get).
  Hunter horses use Observe, Aggressive or Defensive stances. Patrol only
  defines their route: the active stance determines whether they engage,
  pursue, disengage and return to that route.
  Tower kills are credited to the tower's owner and displayed locally.
  Windows networking is required; cross-platform is optional.
  Follow openspec/ROADMAP.md as the product source of truth, including
  its explicit exception to upstream compatibility expectations.
rules:
  specs:
    - Define testable behavior in SHALL requirements with WHEN/THEN scenarios.
    - Distinguish automatic delayed Hunter horse spawning from manual movement and AttackMove.
    - Never limit the lobby to seven humans; the Hunter is a human participant.
    - Keep kill statistics visible only to the current player.
    - Include invalid orders, role checks, contention and disconnection cases.
  design:
    - Reuse simulation events, command queues, pathfinding and Qt Quick/QML.
    - Keep game rules independent of rendering and input.
    - Preserve host authority and authenticate client-to-player assignments.
    - Prioritize working Windows direct-IP/LAN networking; avoid unnecessary upstream compatibility work.
    - Reuse game selection, input and movement infrastructure for Hunter AttackMove; only auto-route spawned horses to a Hunter-set rally point.
  tasks:
    - Test deterministic rules independently from rendering.
    - Verify UI behavior interactively and multiplayer on distinct processes.
    - Use make tests and existing quality checks when available; report blockers.

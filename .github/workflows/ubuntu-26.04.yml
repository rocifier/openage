name: Ubuntu 26.04 CI
# Prefer testing the newest commit on each branch rather than queuing every
# superseded native-engine iteration twice (push + pull_request).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true


on: [push, workflow_dispatch, pull_request]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
    - name: Restore devenv image
      id: devenv-cache
      uses: actions/cache@v4
      with:
        path: /tmp/staging/devenv.tar.zst
        # rebuild the image only when its recipe changes
        key: devenv-image-${{ hashFiles('packaging/docker/devenv/Dockerfile.ubuntu.2604') }}
    - name: Build the Docker image
      if: steps.devenv-cache.outputs.cache-hit != 'true'
      run: sudo DOCKER_BUILDKIT=1 docker build ./packaging/docker/devenv --file ./packaging/docker/devenv/Dockerfile.ubuntu.2604 --tag openage-devenv:latest
      shell: bash
    - name: Save the Docker image
      if: steps.devenv-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/staging
        sudo docker save openage-devenv:latest | zstd -T0 --long=27 > /tmp/staging/devenv.tar.zst
      shell: bash
    - name: Load Docker image
      if: steps.devenv-cache.outputs.cache-hit == 'true'
      run: sudo docker load --input /tmp/staging/devenv.tar.zst
      shell: bash
    - name: Build openage
      run: |
        # the image may come from cache, so refresh its packages before building
        sudo docker run --rm -i -v "$(pwd)":/mnt/openage -w /mnt/openage openage-devenv:latest bash <<'EOF'
        set -e

        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

        mkdir build
        cd build

        cmake \
          -DCMAKE_DISABLE_FIND_PACKAGE_Python=TRUE \
          -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=$(which gcc) \
          -DCMAKE_CXX_COMPILER=$(which g++) \
          -DCMAKE_CXX_FLAGS='' \
          -DCMAKE_EXE_LINKER_FLAGS='' \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_MODULE_LINKER_FLAGS='' \
          -DCMAKE_SHARED_LINKER_FLAGS='' \
          -DDOWNLOAD_NYAN=YES \
          -DCXX_OPTIMIZATION_LEVEL=auto \
          -DCXX_SANITIZE_FATAL=False \
          -DCXX_SANITIZE_MODE=none \
          -DWANT_BACKTRACE=if_available \
          -DWANT_GPERFTOOLS_PROFILER=if_available \
          -DWANT_GPERFTOOLS_TCMALLOC=False \
          -DWANT_INOTIFY=if_available \
          -DWANT_NCURSES=if_available \
          -DWANT_OPENGL=if_available \
          -DWANT_VULKAN=if_available \
          -G Ninja \
          ..

        cmake --build . --parallel $(nproc) --target openage_native_game openage_native_relay openage_native_cpp_tests openage_native_game_args_test openage_native_relay_args_test openage_native_relay_network_test

        # Native C++ registry, no generated test dispatcher or Python callback.
        # Default --all skips asset-bound and deliberately opt-in worker tests;
        # CTest also probes exact/prefix/error reporting.
        ctest -R '^fvd_native_(game|relay)_' --output-on-failure

        # Optional pure-Python tests use the stdlib unittest runner, never
        # import the old Cython C++ test bridge or dispatch engine methods.
        cd ..
        python3 -m unittest -v openage.testing.test_fvd_network_benchmark
        cd build

        # Rebuild native release from the committed engine API: no Python/Cython configuration.
        cmake -DFVD_NATIVE_RELEASE=ON .
        cmake --build . --target openage_native_game --parallel $(nproc)
        ctest -R fvd_native_game_ --output-on-failure
        # A source-level import check is insufficient: reject accidental
        # Python-backed filesystem types in the shipped engine library.
        if nm -DC --defined-only libopenage/libopenage.so | grep -E 'openage::util::(fslike|filelike)::Python::|openage::util::(Path|File)::(Path|File)\(openage::pyinterface::PyObjectRef'; then
          echo "Native engine retained a developer-only Python filesystem adapter"
          exit 1
        fi
        ldd packaging/openage-native | tee native-game-no-python-dependencies.txt
        if grep -Eiq 'libpython|cython' native-game-no-python-dependencies.txt; then
          echo "Python ABI dependency in the native game"
          exit 1
        fi
        # Inspect the exact files selected for the distribution component.
        # The generic installer remains out of scope; audit only FVDNative.
        cmake --install . --prefix "$(pwd)/fvd-native-stage" --component FVDNative
        cmake -DFVD_NATIVE_STAGE="$(pwd)/fvd-native-stage" -DFVD_NATIVE_REQUIRE_MANIFEST=ON -P ../packaging/native_game/AuditNativePackage.cmake

        # Prove that the *staged* Python-free game loads its release manifest,
        # native mounts and real simulation. A timed-out loop is expected;
        # dying early or never reaching initialized threads is not.
        set +e
        timeout --signal=TERM --kill-after=3s 12s \
          env LD_LIBRARY_PATH="$(pwd)/fvd-native-stage/lib:$LD_LIBRARY_PATH" \
          ./fvd-native-stage/bin/openage-native --headless --solo --no-audio \
          --cfg-dir "$(pwd)/fvd-native-smoke-cfg" > native-game-startup.log 2>&1
        _startup_rc=$?
        set -e
        cat native-game-startup.log
        if [ "$_startup_rc" -ne 0 ] && [ "$_startup_rc" -ne 124 ]; then
          echo "Staged FVD native game failed initialization (exit $_startup_rc)"
          exit 1
        fi
        if ! grep -Eq 'Using [0-9]+ threads' native-game-startup.log; then
          echo "Staged FVD native game did not reach engine initialization"
          exit 1
        fi
        EOF

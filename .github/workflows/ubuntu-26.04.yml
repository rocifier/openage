name: Ubuntu 26.04 CI

on: [push, workflow_dispatch, pull_request]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
    - name: Restore devenv image
      id: devenv-cache
      uses: actions/cache@v4
      with:
        path: /tmp/staging/devenv.tar.zst
        # rebuild the image only when its recipe changes
        key: devenv-image-${{ hashFiles('packaging/docker/devenv/Dockerfile.ubuntu.2604') }}
    - name: Build the Docker image
      if: steps.devenv-cache.outputs.cache-hit != 'true'
      run: sudo DOCKER_BUILDKIT=1 docker build ./packaging/docker/devenv --file ./packaging/docker/devenv/Dockerfile.ubuntu.2604 --tag openage-devenv:latest
      shell: bash
    - name: Save the Docker image
      if: steps.devenv-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/staging
        sudo docker save openage-devenv:latest | zstd -T0 --long=27 > /tmp/staging/devenv.tar.zst
      shell: bash
    - name: Load Docker image
      if: steps.devenv-cache.outputs.cache-hit == 'true'
      run: sudo docker load --input /tmp/staging/devenv.tar.zst
      shell: bash
    - name: Build openage
      run: |
        # the image may come from cache, so refresh its packages before building
        sudo docker run --rm -i -v "$(pwd)":/mnt/openage -w /mnt/openage openage-devenv:latest bash <<'EOF'
        set -e

        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

        mkdir build
        cd build

        cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=$(which gcc) \
          -DCMAKE_CXX_COMPILER=$(which g++) \
          -DCMAKE_CXX_FLAGS='' \
          -DCMAKE_EXE_LINKER_FLAGS='' \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_MODULE_LINKER_FLAGS='' \
          -DCMAKE_SHARED_LINKER_FLAGS='' \
          -DDOWNLOAD_NYAN=YES \
          -DCXX_OPTIMIZATION_LEVEL=auto \
          -DCXX_SANITIZE_FATAL=False \
          -DCXX_SANITIZE_MODE=none \
          -DWANT_BACKTRACE=if_available \
          -DWANT_GPERFTOOLS_PROFILER=if_available \
          -DWANT_GPERFTOOLS_TCMALLOC=False \
          -DWANT_INOTIFY=if_available \
          -DWANT_NCURSES=if_available \
          -DWANT_OPENGL=if_available \
          -DWANT_VULKAN=if_available \
          -G Ninja \
          ..

        cmake --build . --parallel $(nproc) -- -k1

        # Process-level FVD tests load the nyan API; export it with the
        # developer tool once, never via the native game executable.
        mkdir -p ../assets/converted
        ./run convert-export-api ../assets/converted
        ./run test -a
        ctest -R fvd_native_game_ --output-on-failure

        # Rebuild just the native game with Python filesystem adapters removed.
        # The developer test suite above intentionally runs before this toggle.
        cmake -DFVD_WITH_PYTHON_ADAPTERS=OFF .
        cmake --build . --target openage_native_game --parallel $(nproc)
        ctest -R fvd_native_game_ --output-on-failure
        # A source-level import check is insufficient: reject accidental
        # Python-backed filesystem types in the shipped engine library.
        if nm -DC --defined-only libopenage/libopenage.so | grep -E 'openage::util::(fslike|filelike)::Python::|openage::util::(Path|File)::(Path|File)\(openage::pyinterface::PyObjectRef'; then
          echo "Native engine retained a developer-only Python filesystem adapter"
          exit 1
        fi
        ldd packaging/openage-native | tee native-game-no-python-dependencies.txt
        if grep -Eiq 'libpython|cython' native-game-no-python-dependencies.txt; then
          echo "Python ABI dependency in the native game"
          exit 1
        fi
        # Inspect the exact files selected for the distribution component.
        # CMake's normal full install still contains developer Python tools.
        cmake --install . --prefix "$(pwd)/fvd-native-stage" --component FVDNative
        cmake -DFVD_NATIVE_STAGE="$(pwd)/fvd-native-stage" -P ../packaging/native_game/AuditNativePackage.cmake
        EOF

name: FVD native game argument parsing

on:
  push:
    paths:
      - "packaging/native_game_args.*"
      - "packaging/native_game_args_test.cpp"
      - "packaging/native_game_test/**"
      - "packaging/native_game/*.ps1"
      - ".github/workflows/fvd-native-game-args.yml"
  pull_request:
    paths:
      - "packaging/native_game_args.*"
      - "packaging/native_game_args_test.cpp"
      - "packaging/native_game_test/**"
      - "packaging/native_game/*.ps1"
      - ".github/workflows/fvd-native-game-args.yml"
  workflow_dispatch:

jobs:
  args:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure CLI parser without engine dependencies
        run: cmake -S packaging/native_game_test -B build/native-game-args -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native-game-args --config Release
      - name: Test
        run: ctest --test-dir build/native-game-args -C Release --output-on-failure
      - name: Validate native archive PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @('packaging/native_game/AuditWindowsImports.ps1', 'packaging/native_game/SmokeTestWindowsArchive.ps1', 'packaging/native_game/AuditWindowsImportsTest.ps1', 'packaging/native_game/NativeProcess.ps1', 'packaging/native_game/NativeProcessTest.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $script"
            }
          }
      - name: Test Windows native dependency auditor
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/native_game/AuditWindowsImportsTest.ps1
      - name: Test Windows smoke-check process exit capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/native_game/NativeProcessTest.ps1

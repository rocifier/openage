name: One-time materialize FVD coordinate sources rerun
on:
  push:
    branches: [fvd-track-engine-api-20261107]
    paths: [.github/workflows/fvd-materialize-coordinates-v2.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mako
      - name: Render coordinate families once and commit ordinary source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from mako.template import Template

          directory = Path("libopenage/coord")
          headers = Template((directory / "coord.h.template").read_text(encoding="utf-8"))
          source = Template((directory / "coord.cpp.template").read_text(encoding="utf-8"))
          for members in (["x", "y"], ["x", "y", "z"], ["ne", "se"], ["ne", "se", "up"]):
              def formatted_members(formatstring, join_with=", "):
                  return join_with.join(formatstring.format(item) for item in members)
              values = dict(members=members, formatted_members=formatted_members,
                            camelcase="".join(word.title() for word in members))
              stem = "coord_" + "".join(members)
              for ext, template in ((".h", headers), (".cpp", source)):
                  rendered = template.render(**values).replace(".gen.h", ".h")
                  (directory / (stem + ext)).write_text(
                      rendered.rstrip("\n") + "\n", encoding="utf-8", newline="\n")

          # All C++ inclusions of the generated header names become ordinary
          # checked-in header inclusions, including non-coordinate consumers.
          for root in (Path("libopenage"), Path("packaging")):
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix in (".h", ".cpp", ".hpp"):
                      previous = path.read_text(encoding="utf-8")
                      updated = previous.replace("coord_xy.gen.h", "coord_xy.h") \
                          .replace("coord_xyz.gen.h", "coord_xyz.h") \
                          .replace("coord_nese.gen.h", "coord_nese.h") \
                          .replace("coord_neseup.gen.h", "coord_neseup.h")
                      if updated != previous:
                          path.write_text(updated, encoding="utf-8", newline="\n")

          cmake = directory / "CMakeLists.txt"
          text = cmake.read_text()
          text = text.replace("\tchunk.cpp\n", "\tchunk.cpp\n" +
              "\tcoord_xy.cpp\n\tcoord_xyz.cpp\n\tcoord_nese.cpp\n\tcoord_neseup.cpp\n")
          cmake.write_text(text, encoding="utf-8", newline="\n")

          listing = Path("openage/codegen/listing.py")
          text = listing.read_text()
          text = text.replace("\n    from .coord import generate_coord_basetypes\n\n    generate_coord_basetypes(projectdir)\n", "\n")
          assert "generate_coord_basetypes" not in text
          listing.write_text(text, encoding="utf-8", newline="\n")
          (directory / "coord.h.template").unlink()
          (directory / "coord.cpp.template").unlink()
          Path("openage/codegen/coord.py").unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A libopenage/coord libopenage packaging openage/codegen
          git diff --cached --check
          git commit -m 'Commit coordinate template families as native C++ sources'
          git push origin HEAD:fvd-track-engine-api-20261107

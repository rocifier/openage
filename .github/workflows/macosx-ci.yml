name: macOS-CI
# Prefer testing the newest commit on each branch rather than queuing every
# superseded native-engine iteration twice (push + pull_request).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on: [push, pull_request]

jobs:
  # https://docs.github.com/en/actions/reference/software-installed-on-github-hosted-runners
  # we install stuff not already there
  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # caching dependencies and ccache
      # https://docs.github.com/en/actions/configuring-and-managing-workflows/caching-dependencies-to-speed-up-workflows
      - name: Get timestamp
        id: timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H:%M:%S" UTC)
          message("timestamp=${current_date}" >> $GITHUB_OUTPUT)
      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            ~/Library/Caches/pip
            ~/Library/Caches/Homebrew
          key: '${{ runner.os }}-deps-${{ steps.timestamp.outputs.timestamp }}'
          restore-keys: |
            ${{ runner.os }}-deps-
      - name: Cache ccache dir
        uses: actions/cache@v4
        id: cache-ccache
        with:
          path: ~/Library/Caches/ccache
          key: '${{ runner.os }}-ccache-${{ steps.timestamp.outputs.timestamp }}'
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Brew update-reset
        run: brew update-reset
      - name: Brew update
        run: brew update
      - name: Brew install DeJaVu fonts
        run: brew install --cask font-dejavu
      - name: Install environment helpers with homebrew
        run: brew install --force ccache ninja
      - name: Install openage dependencies with homebrew
        run: brew install --force cmake python3 libepoxy freetype fontconfig harfbuzz opus opusfile qt6 libogg libpng toml11 eigen llvm
      - name: Install nyan dependencies with homebrew
        run: brew install --force flex make
      - name: Select Homebrew LLVM for C++ module dependency scanning
        run: |
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix llvm)/bin/clang++" --version
      - name: Configure native C++ build
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B bin -DCMAKE_BUILD_TYPE=Release -DDOWNLOAD_NYAN=YES -DFVD_NATIVE_RELEASE=OFF -DCMAKE_OSX_SYSROOT="$SDKROOT"
      - name: Build native game relay and tests
        run: cmake --build bin --parallel $(sysctl -n hw.logicalcpu) --target openage_native_game openage_native_relay openage_native_cpp_tests
      - name: Test
        run: ctest --test-dir bin -R '^fvd_native_(game|relay)_' --output-on-failure

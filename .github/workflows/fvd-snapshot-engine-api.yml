name: Bootstrap tracked FVD engine API (one-time)

on:
  push:
    branches: [fvd-track-engine-api-20261107]
    paths: [.github/workflows/fvd-snapshot-engine-api.yml]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter's pure Python dependencies
        run: python -m pip install --disable-pip-version-check tomli-w numpy lz4 pillow
      - name: Export the accepted nyan API from the current FVD source
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha3_256
          from pathlib import Path
          from openage.convert.tool.api_export import create_modpack

          root = Path("assets/fvd/engine_api")
          modpack = create_modpack()
          for definition in [modpack.info, *modpack.get_data_files()]:
              destination = root / definition.targetdir.lstrip("/") / definition.filename
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(definition.dump().encode("utf-8"))
          modpack.manifest.set_hashing_func("sha3_256")
          for file in sorted(root.rglob("*")):
              if file.is_file():
                  modpack.manifest.add_hash_value(sha3_256(file.read_bytes()).hexdigest(),
                                                    file.relative_to(root).as_posix())
          (root / "manifest.toml").write_bytes(modpack.manifest.dump().encode("utf-8"))
          (root / "LICENSE.md").write_text(
              "The engine API data is derived from openage's GPL-3.0-or-later "
              "converter definitions. See ../../../copying.md for the "
              "project licence. The nyan data is exported from "
              "openage/convert/service/read/nyan_api_loader.py at the "
              "revision that introduced this snapshot.\n", encoding="utf-8", newline="\n")
          nyan = list(root.rglob("*.nyan"))
          if len(nyan) < 100:
              raise SystemExit(f"Incomplete engine API snapshot: {len(nyan)} nyan files")
          print(f"Tracked engine API: {len(nyan)} nyan files")
          PY
      - name: Commit generated source snapshot to this feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/fvd/engine_api
          git diff --cached --quiet && exit 0
          git commit -m "Vendor accepted engine API 0.5.0 as tracked FVD data"
          git push origin HEAD:fvd-track-engine-api-20261107

name: FVD Pelican Python Generic relay bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/native_relay/**"
      - "packaging/native_relay_main.cpp"
      - "packaging/native_relay_args.*"
      - "libopenage/network/relay*"
      - "libopenage/network/transport.*"
      - "libopenage/network/protocol.*"
      - "libopenage/network/serialization.*"
      - "libopenage/error/**"
      - "libopenage/log/**"
      - "libopenage/util/**"
      - ".github/workflows/fvd-pelican-relay.yml"
  push:
    branches: [FVD]
    paths:
      - "packaging/native_relay/**"
      - "packaging/native_relay_main.cpp"
      - "packaging/native_relay_args.*"
      - "libopenage/network/relay*"
      - "libopenage/network/transport.*"
      - "libopenage/network/protocol.*"
      - "libopenage/network/serialization.*"
      - "libopenage/error/**"
      - "libopenage/log/**"
      - "libopenage/util/**"
      - ".github/workflows/fvd-pelican-relay.yml"

jobs:
  portable-relay:
    name: Static musl native relay (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build and test entirely static C++ relay on Alpine (not on Pelican)
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm --platform "linux/$ARCH" \
            -e ARCH="$ARCH" -v "$PWD:/src" -w /src alpine:3.21 sh -euc '
              apk add --no-cache cmake ninja g++ binutils
              cmake -S packaging/native_relay -B "build/pelican-$ARCH" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DFVD_RELAY_PORTABLE_STATIC=ON
              cmake --build "build/pelican-$ARCH" --parallel 2
              ctest --test-dir "build/pelican-$ARCH" --output-on-failure
              exe="build/pelican-$ARCH/openage-relay"
              if readelf -l "$exe" | grep -q INTERP; then
                echo "ERROR: portable relay has a dynamic loader dependency" >&2
                exit 1
              fi
              if readelf -d "$exe" 2>/dev/null | grep -q NEEDED; then
                echo "ERROR: portable relay has a shared-library dependency" >&2
                exit 1
              fi
              "$exe" --version
              mkdir -p "build/pelican-$ARCH/upload/bin"
              cp "$exe" "build/pelican-$ARCH/upload/bin/openage-relay-linux-$ARCH"
              cp packaging/native_relay/pelican/app.py \
                 packaging/native_relay/pelican/relay.py \
                 "build/pelican-$ARCH/upload/"
              chmod 755 "build/pelican-$ARCH/upload/bin/openage-relay-linux-$ARCH"
            '

      - name: Test stock Pelican Python yolk and exact Generic egg startup
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          name="fvd-pelican-smoke-${ARCH}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          startup='if [[ -d .git ]] && [[ "{{AUTO_UPDATE}}" == "1" ]]; then git pull; fi; if [[ ! -z "{{PY_PACKAGES}}" ]]; then pip install -U --prefix .local {{PY_PACKAGES}}; fi; if [[ -f /home/container/${REQUIREMENTS_FILE} ]]; then pip install -U --prefix .local -r ${REQUIREMENTS_FILE}; fi; /usr/local/bin/python /home/container/{{PY_FILE}}'
          docker run -d --name "$name" --platform "linux/$ARCH" \
            -v "$PWD/build/pelican-$ARCH/upload:/home/container:ro" \
            -e STARTUP="$startup" -e SERVER_PORT=42173 \
            -e PY_FILE=app.py -e USER_UPLOAD=1 \
            -e AUTO_UPDATE=0 -e PY_PACKAGES= \
            -e REQUIREMENTS_FILE=requirements.txt \
            ghcr.io/pelican-eggs/yolks:python_3.12
          success=0
          for attempt in $(seq 1 90); do
            if docker logs "$name" 2>&1 | grep -q 'FVD relay listening on 0.0.0.0:42173'; then
              success=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]]; then
              break
            fi
            sleep 1
          done
          docker logs "$name" 2>&1
          if [[ "$success" != 1 ]]; then
            echo "Stock Pelican egg did not launch the native relay" >&2
            exit 1
          fi
          docker stop -s SIGINT -t 12 "$name" >/dev/null
          status="$(docker inspect -f '{{.State.ExitCode}}' "$name")"
          if [[ "$status" != 0 ]]; then
            echo "Relay did not exit cleanly on Pelican stop: $status" >&2
            exit 1
          fi
          docker rm "$name" >/dev/null
          trap - EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: fvd-pelican-relay-bin-${{ matrix.arch }}
          path: build/pelican-${{ matrix.arch }}/upload/bin/openage-relay-linux-${{ matrix.arch }}
          if-no-files-found: error

  launcher-tests:
    name: Python egg launcher tests (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run default egg, config, architecture, exec/signal-oriented tests
        run: python3 -m unittest discover -s packaging/native_relay/pelican -p 'test_*.py' -v

  upload-bundle:
    name: Drop-in Pelican relay ZIP
    runs-on: ubuntu-latest
    needs: [portable-relay, launcher-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fvd-pelican-relay-bin-*
          path: pelican-release/bin
          merge-multiple: true
      - name: Assemble upload-ready folder and ZIP, no host-side setup
        run: |
          set -euo pipefail
          cp packaging/native_relay/pelican/app.py pelican-release/
          cp packaging/native_relay/pelican/relay.py pelican-release/
          cp packaging/native_relay/pelican/relay.example.json pelican-release/
          cp packaging/native_relay/pelican/README.md pelican-release/
          test -s pelican-release/bin/openage-relay-linux-amd64
          test -s pelican-release/bin/openage-relay-linux-arm64
          chmod +x pelican-release/bin/openage-relay-linux-*
          python3 - <<'PY'
          import pathlib
          import zipfile
          root = pathlib.Path("pelican-release")
          with zipfile.ZipFile("fvd-pelican-relay.zip", "w", zipfile.ZIP_DEFLATED) as out:
              for item in sorted(root.rglob("*")):
                  if item.is_file():
                      out.write(item, item.relative_to(root))
          PY
          unzip -l fvd-pelican-relay.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fvd-pelican-relay-upload-ready
          path: fvd-pelican-relay.zip
          if-no-files-found: error

# Optional pure-Python developer tooling. Native FVD builds do not install this package.
[project]
name = "openage"
version = "0.6.0"
description = "free (as in freedom) open source reimplementation of the Genie engine"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
maintainers = [
    { name = "SFTtech", email = "openage@sft.lol" },
]

dependencies = []

[project.urls]
homepage = "https://github.com/SFTtech/openage"
source = "https://github.com/SFTtech/openage"
issues = "https://github.com/SFTtech/openage/issues"
releasenotes = "https://github.com/SFTtech/openage/releases"

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.uv]
# Native FVD is a C++ application; optional Python tools run from source.
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    ".idea",
    ".mypy_cache",
    ".venv*",
    "docs",
    "debian",
    "__pycache__",
    "*.egg_info",
]

[tool.ruff.lint]
select = ["E", "W", "B", "F", "I", "C", "N", "PL", "RUF", "PYI", "I001"]
ignore = [
    "E722",
    "PLR2004",
    "PLR0912",
    "PLR5501",
    "PLC0415",
    "PLR0911",
    "C408",
    "PLR0915",
    "PLW2901",
    "C901",
]
pylint.max-args = 10

